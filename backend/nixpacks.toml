[phases.setup]
# `python311Packages.pip` ensures `python -m pip` is available on the
# Nixpacks Python 3.11 derivation. We deliberately do NOT call
# `ensurepip` (older Nixpacks images fail that step) — pip is provided
# by the Nix package above instead.
nixPkgs = ["python311", "python311Packages.pip"]

[phases.install]
cmds = [
  "python -m pip install --upgrade pip",
  "python -m pip install -r requirements.txt"
]

[start]
cmd = "uvicorn server:app --host 0.0.0.0 --port $PORT --workers 1"
