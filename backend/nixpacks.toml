[phases.setup]
# Nixpacks' bare `python311` derivation ships Python without a usable `pip`
# binary on PATH. Including `python311Packages.pip` makes `python -m pip`
# work reliably; the explicit `ensurepip` step is a belt-and-braces fallback
# for older Nixpacks builders where the Python package set varies.
nixPkgs = ["python311", "python311Packages.pip"]

[phases.install]
cmds = [
  "python -m ensurepip --upgrade",
  "python -m pip install --upgrade pip",
  "python -m pip install -r requirements.txt"
]

[start]
cmd = "uvicorn server:app --host 0.0.0.0 --port $PORT --workers 1"
