[pytest]
testpaths = tests
# Put backend/ on sys.path so `server`, `db.*`, `engine.*` and `tests._memstub`
# import the same way under bare `pytest` as under `python -m pytest` (the -m
# form adds the CWD implicitly; the bare form does not, and CI uses bare).
pythonpath = .
# Default run is fully offline (stub db, stub auth, stub LLM) so CI needs no
# Mongo, no Anthropic key, and no deployment. The `live` suites hit a real
# backend — opt in with: pytest -m live
addopts = -m "not live"
markers =
    live: requires a reachable deployment and seeded test account
